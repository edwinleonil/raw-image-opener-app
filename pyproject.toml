[project]
name = "raw-image-opener-app"
version = "0.1.0"
description = "A small desktop viewer for headerless .raw sensor dumps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "paddleocr>=3.4.1,<4",
    "paddlepaddle-gpu>=3.0",
    "nvidia-cudnn-cu12>=9.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pyinstaller",
]

[tool.uv]
package = false

override-dependencies = ["nvidia-cudnn-cu12==9.9.*"]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true
