[project]
name = "raw-image-opener-app"
version = "0.1.0"
description = "A small desktop viewer for headerless .raw sensor dumps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "paddleocr>=2.7",
    "paddlepaddle-gpu>=3.0",
]

[dependency-groups]
dev = [
    "pyinstaller",
]

[tool.uv]
package = false

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129" }

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true
